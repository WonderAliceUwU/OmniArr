services:
  omniarr:
    image: wonderalice/aliceserver:latest
    # Para usar una versión específica, cambia 'latest' por el tag (ej: wonderalice/aliceserver:1.0.0)
    # Para construir desde código fuente en su lugar, descomenta las siguientes líneas:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: omniarr
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      OMNIARR_DATA_DIR: /app/data
      TMDB_BEARER_TOKEN: ""
    volumes:
      - ./data:/app/data
