services:
  omniarr:
    image: wonderalice/omniarr:1.2.2
    # Para construir desde código fuente en su lugar, descomenta estas líneas:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: omniarr
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      OMNIARR_DATA_DIR: /app/data
    volumes:
      - ${OMNIARR_DATA_DIR:-./data}:/app/data
